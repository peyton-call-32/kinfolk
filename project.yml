name: Kinfolk
options:
  bundleIdPrefix: com.kinfolk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Kinfolk:
    type: application
    platform: iOS
    sources: [Kinfolk, Shared]
    info:
      path: Kinfolk/Info.plist
      properties:
        CFBundleDisplayName: Kinfolk
        UIAppFonts: [Fraunces.ttf, Fraunces-Italic.ttf]
        NSPhotoLibraryUsageDescription: Kinfolk uses this to add a photo of Papa.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [kinfolk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinfolk.Kinfolk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: KinfolkWidget
  KinfolkWidget:
    type: app-extension
    platform: iOS
    sources: [KinfolkWidget, Shared]
    info:
      path: KinfolkWidget/Info.plist
      properties:
        CFBundleDisplayName: Kinfolk
        UIAppFonts: [Fraunces.ttf, Fraunces-Italic.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinfolk.Kinfolk.Widget
